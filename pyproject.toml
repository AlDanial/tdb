[project]
name = "tdb"
version = "0.1.0"
description = "A TUI-based Python debugger using debugpy and textual"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.0.0",
    "debugpy>=1.8.0",
    "pygments>=2.17.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",

    "numpy",
    "scipy",
    "matplotlib",
    "scikit-learn",
    "PyQt6",
    "nats-py",
    "pyyaml",

]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
tdb = "tdb.cli:main"

[tool.setuptools]
packages = ["tdb", "tdb.dap", "tdb.session", "tdb.widgets", "tdb.keybindings", "tdb.server"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
