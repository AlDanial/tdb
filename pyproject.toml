  [project]
  name = "textual-debugger"
  dynamic = ["version"]
  description = "A TUI debugger for Python, Perl, Ruby and other languages.  Based on textual."
  readme = "README.md"
  requires-python = ">=3.11"
  license = {file = "LICENSE"}
  authors = [{name = "Al Danial", email = "al.danial@gmail.com"}]
  keywords = ["debugger", "tui", "textual", "debugpy", "debug", "DAP"]
  classifiers = [
      "Development Status :: 4 - Beta",
      "Environment :: Console",
      "Intended Audience :: Developers",
      "License :: OSI Approved :: MIT License",
      "Operating System :: POSIX :: Linux",
      "Programming Language :: Python :: 3",
      "Programming Language :: Python :: 3.11",
      "Programming Language :: Python :: 3.12",
      "Programming Language :: Python :: 3.13",
      "Programming Language :: Python :: 3.14",
      "Programming Language :: Python :: 3.15",
      "Topic :: Software Development :: Debuggers",
  ]
  dependencies = [
      "textual>=8.0.0",
      "debugpy>=1.8.0",
      "pygments>=2.17.0",
      "fastapi>=0.115.0",
      "uvicorn>=0.30.0",
      "mcp>=1.28.0,<2.0.0",
]

  # extras needed to run the examples and tests
  [project.optional-dependencies]
  dev = ["pytest", "pytest-cov", "pytest-asyncio", "httpx",
         "matplotlib",
         "pyyaml",
         "toml",
         "ruff",
         "ipython"]

  [project.urls]
  Homepage = "https://github.com/AlDanial/tdb"
  Issues = "https://github.com/AlDanial/tdb/issues"
  Source = "https://github.com/AlDanial/tdb"

  [project.scripts]
  tdb = "tdb.cli:main"
  tdb-mcp = "tdb.mcp.server:main"

  [build-system]
  requires = ["setuptools>=68.0"]
  build-backend = "setuptools.build_meta"

  [tool.setuptools.dynamic]
  version = {attr = "tdb.__version__"}

  [tool.setuptools.packages.find]
  where = ["src"]

  [tool.setuptools.package-data]
  tdb = ["README.md", "adapters/perl/helpers.pl", "adapters/perl/Devel/TdbRemote.pm", "adapters/perl/Devel/TdbCompile.pm", "adapters/bash/tdb_harness.sh", "adapters/ruby/stdout_sync.rb"]

  [tool.pytest.ini_options]
  testpaths = ["tests"]
  asyncio_mode = "auto"
  addopts = "--cov=tdb --cov-report=term-missing"
  filterwarnings = [
      "ignore::DeprecationWarning",
  ]

  [tool.coverage.run]
  source = ["src/tdb"]
  branch = true
  omit = [
      "*/tests/*",
      "src/tdb/__main__.py",
  ]

  [tool.coverage.report]
  exclude_lines = [
      "pragma: no cover",
      "raise NotImplementedError",
      "if TYPE_CHECKING:",
      "if __name__ == .__main__.:",
  ]
  show_missing = true
  skip_covered = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.3.0",
]
