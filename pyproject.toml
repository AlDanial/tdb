[project]
name = "tdbg"
version = "0.1.0"
description = "A TUI-based Python debugger using debugpy and textual"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.0.0",
    "debugpy>=1.8.0",
    "pygments>=2.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
tdbg = "tdbg.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
