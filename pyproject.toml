  [project]
  name = "textual-debugger"
  version = "0.0.2"
  description = "A TUI Python debugger based on textual and debugpy"
  readme = "README.md"
  requires-python = ">=3.10"
  license = {file = "LICENSE"}
  authors = [{name = "Al Danial", email = "al.danial@gmail.com"}]
  keywords = ["debugger", "tui", "textual", "debugpy", "debug", "DAP"]
  classifiers = [
      "Development Status :: 4 - Beta",
      "Environment :: Console",
      "Intended Audience :: Developers",
      "License :: OSI Approved :: MIT License",
      "Operating System :: POSIX :: Linux",
      "Programming Language :: Python :: 3",
      "Programming Language :: Python :: 3.10",
      "Programming Language :: Python :: 3.11",
      "Programming Language :: Python :: 3.12",
      "Topic :: Software Development :: Debuggers",
  ]
  dependencies = [
      "textual>=8.0.0",
      "debugpy>=1.8.0",
      "pygments>=2.17.0",
      "fastapi>=0.115.0",
      "uvicorn>=0.30.0",
  ]

  # extras needed to run the examples and tests
  [project.optional-dependencies]
  dev = ["pytest", "pytest-asyncio", "httpx",
         "matplotlib",
         "pyyaml",
         "toml",
         "ruff",
         "ipython"]

  [project.urls]
  Homepage = "https://github.com/AlDanial/tdb"
  Issues = "https://github.com/AlDanial/tdb/issues"
  Source = "https://github.com/AlDanial/tdb"

  [project.scripts]
  tdb = "tdb.cli:main"

  [build-system]
  requires = ["setuptools>=68.0"]
  build-backend = "setuptools.build_meta"

  [tool.setuptools.packages.find]
  where = ["src"]

  [tool.pytest.ini_options]
  testpaths = ["tests"]
  asyncio_mode = "auto"
  filterwarnings = [
      "ignore::DeprecationWarning",
  ]
